# health Check Block (Internal Only) - Must Come First
server {
    listen 80;
    server_name 127.0.0.1;
    
    location /health {
	access_log off;
	return 200 "healthy\n";
	add_header Content-Type text/plain;
    }
}


server {
    listen 80;
    server_name lusblog.com www.lusblog.com; # Use your actual domain here

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;

    location /.well-known/acme-challenge/ {
	root /var/www/certbot;
    }
}

# HTTPS server block
server {
    listen 443 ssl;
    server_name lusblog.com www.lusblog.com; # Use your actual domain here

    ssl_certificate /etc/letsencrypt/live/lusblog.com/fullchain.pem; # Path to your certificate
    ssl_certificate_key /etc/letsencrypt/live/lusblog.com/privkey.pem; # Path to your private key

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";


    # Increase upload size limits
    client_max_body_size 100M;
    client_body_buffer_size 1M;
    client_body_timeout 60s;

    root /usr/share/nginx/html;
    index index.html;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # Vue.js routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to backend
    location /api/ {
	# Backend is still HTTP internally
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # File upload settings
        client_max_body_size 100M;
        proxy_request_buffering off;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static file caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /weblog/ {
	proxy_pass http://minio:9000/weblog/;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
    }

}
