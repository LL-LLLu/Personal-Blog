version: '3.8'

services:
  jenkins:
    build: .
    container_name: weblog-jenkins
    restart: always
    user: root # Required to access the docker socket in this specific setup
    ports:
      - "8081:8080" # Running on 8081 to avoid conflict with your backend (8080)
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # Access host Docker
    networks:
      - weblog-network

networks:
  weblog-network:
    driver: bridge

volumes:
  jenkins_home:
    driver: local